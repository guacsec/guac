syntax = "proto3";
option go_package = "github.com/guacsec/guac/pkg/ingestor/ingestapi";

package guacsec.guac.ingestor.schema;

// DocumentMetaData describes where the document came from. It maps onto
// processor.SourceInformation and must be the first message on the stream.
message DocumentMetaData {
    string collectorInformation = 1;
    string sourceInformation = 2;
}

// Document carries one chunk of the document body. Chunks are concatenated in
// the order they are received, so a client must not interleave streams.
message Document {
    bytes content = 1;
}

enum Status {
    PENDING = 0;
    IN_PROGRESS = 1;
    SUCCESS = 2;
    FAILED = 3;
}

message DocumentIngestRequest {
    oneof request {
        DocumentMetaData metadata = 1;
        Document doc = 2;
    }
}

message DocumentIngestResponse {
    Status status = 1;
    // documentRef is the content addressed key of the document, matching the
    // key the blob store path would use. Clients can correlate it with server
    // side logs, which tag every line with the same value.
    string documentRef = 2;
}

// DocumentIngestService accepts documents directly over the network, avoiding
// the message size limits of the pubsub path. Ingestion is synchronous: the
// response is not sent until the document is in the graph, and failures are
// returned as gRPC status codes.
service DocumentIngestService {
    rpc IngestDocument(stream DocumentIngestRequest) returns (DocumentIngestResponse);
}
