mutation IngestSafetyAssertion($assertion: SafetyAssertionInputSpec!) {
  ingestSafetyAssertion(assertion: $assertion)
}

query SafetyAssertions($spec: SafetyAssertionSpec!, $after: ID, $first: Int) {
  SafetyAssertionList(
    safetyAssertionSpec: $spec
    after: $after
    first: $first
  ) {
    totalCount
    pageInfo {
      hasNextPage
      startCursor
      endCursor
    }
    edges {
      cursor
      node {
        id
        assertionId
        safetyRelevance
        classificationScheme
        classificationValue
        rationale
        decisionStatus
        reviewer
        assertedAt
        validUntil
        target {
          productPurl
          componentPurl
          componentBomRef
          componentDigestAlgorithm
          componentDigest
          correlationStatus
          correlationReason
          lastEvaluatedAt
        }
        binding {
          ...SafetyBinding
        }
        evidence {
          evidenceId
          uri
          digestAlgorithm
          digest
        }
        sourceAuthority
        origin
        collector
        documentRef
        documentDigestAlgorithm
        documentDigest
      }
    }
  }
}

mutation ReconcileSafetyAssertion($id: ID!) {
  reconcileSafetyAssertion(id: $id) {
    id
    target {
      correlationStatus
      correlationReason
      lastEvaluatedAt
    }
    binding {
      ...SafetyBinding
    }
  }
}

fragment SafetyBinding on SafetyAssertionBinding {
  product {
    ...AllPkgTree
  }
  component {
    ...AllPkgTree
  }
  matchedBy
  resolvedAt
}

query SafetyAssertionCandidates($after: ID, $first: Int) {
  SafetyAssertionList(safetyAssertionSpec: {}, after: $after, first: $first) {
    pageInfo {
      hasNextPage
      endCursor
    }
    edges {
      node {
        id
      }
    }
  }
}
